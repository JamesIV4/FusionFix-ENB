[ENBCompatibility]                            // see docs/ENBCompatibility.md. Mode = 0 is upstream FusionFix, unchanged.
Mode = 1                                      // 0: off | 1: ENB-compatible rendering | Auto: enable when an ENB is detected
VerboseLogging = 1                            // write ENBCompat.log next to GTAIV.exe even when Mode = 0

// Individual renderer features. Absent means "use the mode default": everything
// on when Mode = 0, everything below off when ENB mode is active. Set one
// explicitly to bisect a single feature without changing the rest.
// ReplacePostFX = 0                          // FusionFix replaces the game's post-process draw
// PostProcessAA = 0                          // FusionFix FXAA / SMAA passes
// AmbientOcclusion = 0                       // FusionFix ambient occlusion pass
// SunShafts = 0                              // FusionFix sun shafts
// PreAlphaDepthCopy = 0                      // depth copy taken before the alpha pass
// SkyDiffuseSplit = 0                        // second sky draw into the GBuffer diffuse target
// ConsoleGammaBlit = 0                       // console-gamma blit onto the real back buffer at EndScene
// ShaderConstantInjection = 0                // uploads to c208..c223 / c227..c237; only FusionFix shaders read these
// FusionShaderPackage = 0                    // 0: load the game's stock shaders instead of the FusionFix package

StockShaderFolder = win32_30_nv8              // which stock shader-variant folder to load from when FusionShaderPackage = 0.
                                              // win32_30 | win32_30_low_ati | win32_30_nv6 | win32_30_nv7 | win32_30_nv8 | win32_30_atidx10
                                              // Anything but win32_30, which is the folder the FusionFix package overlays.

// Report a different game version to one plugin. Some mods refuse to load on
// Complete Edition; this satisfies a version check that reads GTAIV.exe's
// version resource, without altering anything on disk. Scoped by caller module,
// so nothing else in the process sees the changed value.
//
// NOTE: iCEnhancer 4's check turned out to gate 1.0.4.0-specific work on the
// executable -- satisfying it makes it fault immediately. See research/.
SpoofGameVersion =                            // e.g. 1.0.4.0; empty = off
SpoofGameVersionFor = icenhancer.asi          // module the spoofed version is reported to; empty = every caller
LoadPluginAfterSpoof =                        // load this plugin after the hook is placed, instead of leaving the
                                              // order to the ASI loader. Give the file an extension the loader
                                              // ignores (e.g. .enbcompat) so only this setting loads it.

// D3D9 instrumentation. Diagnostic only, alters no rendering, off by default.
// Output goes to the ENBCompat folder next to GTAIV.exe.
D3D9Trace = 0                                 // master switch for the tracer
DumpShaders = 0                               // write every created shader blob as .cso alongside shaders.csv
TraceKey = 45                                 // Insert arms a capture; 0 = use TraceStartFrame instead
TraceStartFrame = 0                           // first frame to trace when TraceKey = 0
TraceFrameCount = 2                           // frames captured per trigger
TraceResources = 1                            // render target / depth / texture creation and binding
TraceShaderBinds = 0                          // every pixel-shader bind, by creation hash
TraceTextures = 0                             // every SetTexture; heavy
TraceConstants = 0                            // every SetPixelShaderConstantF / SetVertexShaderConstantF; heavy
TraceDraws = 0                                // every draw call; very heavy
