[ENBCompatibility]
Mode = 1
VerboseLogging = 1

// ENB mode is strictly stock Complete Edition shaders. Shader-feature override
// keys and the former modern postfx bridge are no longer supported.
// Install the exact baseline with Invoke-StockENBTest.ps1 before launching.
// Gameplay, camera and other non-shader settings remain in their usual sections.

SpoofGameVersion =
SpoofGameVersionFor = icenhancer.asi
LoadPluginAfterSpoof =

D3D9Trace = 0
DumpShaders = 0
TraceKey = 45
TraceStartFrame = 0
TraceFrameCount = 2
TraceResources = 1
TraceShaderBinds = 0
TraceTextures = 0
TraceConstants = 0
TraceDraws = 0
